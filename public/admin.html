<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админка — Healthy Paws</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="logo" href="admin.html">Healthy<span>Paws</span></a>

      <nav class="menu" id="menu" aria-label="Разделы админки">
        <button data-view="services">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Каталог услуг
        </button>
        <button data-view="appointments">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Записи
        </button>
        <button data-view="clients">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .7 3.5 2.5 3.5 5.5"/></svg>Клиенты
        </button>
      </nav>

      <div class="side__bottom">
        <div class="me">
          <span class="me__ava" id="me-ava"></span>
          <div><b id="me-name"></b><small>Администратор</small></div>
        </div>
        <nav class="menu" aria-label="Настройки">
          <button data-view="settings">
            <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Настройки
          </button>
        </nav>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <h1 id="title"></h1>
        <button class="btn" id="add">+ Добавить услугу</button>
      </header>
      <div id="view"></div>
    </main>
  </div>

  <dialog id="dlg"><div id="dlg-body"></div></dialog>
  <script src="admin.js"></script>
</body>
</html>
